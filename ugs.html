<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ultimate Game Stash</title>
<style>
:root{color-scheme:dark;--bg:#090d1b;--panel:#111a30;--line:#293854;--text:#e8eefc;--muted:#9baac4;--accent:#6398ef}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;color:var(--text);background:linear-gradient(135deg,#202b49,#241739)}
.layout{display:flex;min-height:100vh}.sidebar{position:sticky;top:0;width:64px;height:100vh;overflow:auto;flex:none;padding:12px 7px;background:#080d19b8;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.sidebar button{border:0;border-radius:7px;padding:9px 3px;background:#355d9b;color:white;font-weight:bold;cursor:pointer}.sidebar button:hover{background:#5488d5}
main{width:min(1120px,100%);margin:0 auto;padding:28px 20px 60px}header{text-align:center;margin-bottom:22px}h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px)}.muted{color:var(--muted)}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
input{width:min(520px,100%);padding:13px 15px;border-radius:10px;border:1px solid var(--line);background:#0d1629;color:var(--text);font-size:16px}
#stats{color:var(--muted);text-align:center;margin:12px 0 24px}.section{margin:26px auto;max-width:900px;scroll-margin-top:14px}.section h2{border-bottom:2px solid #ffffff30;padding-bottom:8px;font-size:25px}.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:9px}
.game{border:1px solid var(--line);border-radius:9px;background:#111b30;color:var(--text);padding:13px 14px;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.game:hover{border-color:var(--accent);background:#1b2b49}.game:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{min-height:24px;text-align:center;color:var(--muted)}a{color:#91baff}
#player{position:fixed;inset:0;z-index:20;background:#070b14;display:none;flex-direction:column}
#player.open{display:flex}.player-bar{height:54px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:#111a30;border-bottom:1px solid var(--line)}
#player-title{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#close-player{border:1px solid #49638b;border-radius:8px;background:#263b5d;color:white;padding:8px 13px;font-weight:bold;cursor:pointer}
#game-frame{display:block;width:100%;height:calc(100% - 54px);border:0;background:#fff;flex:1}
@media(max-width:600px){.sidebar{width:48px;padding:8px 4px}.sidebar button{padding:7px 2px}main{padding:20px 12px}.player-bar{height:50px}#game-frame{height:calc(100% - 50px)}}
</style>
</head>
<body>
<div id="player" aria-hidden="true">
  <div class="player-bar"><span id="player-title">Loading game…</span><button id="close-player" type="button">✕ Close game</button></div>
  <iframe id="game-frame" title="Game player" allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write" allowfullscreen></iframe>
</div>
<div class="layout"><nav class="sidebar" id="sidebar" aria-label="Jump to letter"></nav><main>
<header><h1>Ultimate Game Stash</h1><p class="muted">Browse and launch games from the UGS single-file collection.</p><p class="muted">Games open in the built-in player without creating a new tab.</p></header>
<div class="controls"><input id="search" type="search" placeholder="Search games..." autocomplete="off" aria-label="Search games"></div>
<p id="stats">Loading game list…</p><p id="status" role="status"></p><div id="sections"></div>
<p class="muted" style="text-align:center;margin-top:36px">Source: <a href="https://github.com/bubbls/ugs-singlefile" target="_blank" rel="noopener noreferrer">bubbls/ugs-singlefile</a></p>
</main></div>
<script>
const DATA_URL="./ugs-games.json";
const CDN_ROOT="https://cdn.jsdelivr.net/gh/bubbls/ugs-singlefile/UGS-Files/";
const chars="0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const search=document.getElementById("search"),sections=document.getElementById("sections"),stats=document.getElementById("stats"),status=document.getElementById("status"),sidebar=document.getElementById("sidebar");
const player=document.getElementById("player"),playerTitle=document.getElementById("player-title"),gameFrame=document.getElementById("game-frame");
let games=[];
const displayName=id=>id.toLowerCase().startsWith("cl")?id.slice(2):id;
const firstChar=id=>{const c=displayName(id).charAt(0).toUpperCase();return chars.includes(c)?c:"#"};
function closeGame(){
  player.classList.remove("open");
  player.setAttribute("aria-hidden","true");
  gameFrame.srcdoc="";
  document.body.style.overflow="";
  status.textContent="Game closed.";
}
document.getElementById("close-player").addEventListener("click",closeGame);
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&player.classList.contains("open"))closeGame()});
function launch(id){
  status.textContent="Loading "+displayName(id)+"…";
  playerTitle.textContent=displayName(id);
  player.classList.add("open");
  player.setAttribute("aria-hidden","false");
  document.body.style.overflow="hidden";
  gameFrame.srcdoc="<p style='font:16px Arial;padding:20px'>Loading game…</p>";
  const filename=id.includes(".")&&id.lastIndexOf(".")>0?id:id+".html";
  fetch(CDN_ROOT+encodeURIComponent(filename)+"?t="+Date.now())
    .then(response=>{if(!response.ok)throw new Error("HTTP "+response.status);return response.text()})
    .then(html=>{
      const baseTag='<base href="'+CDN_ROOT.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'">';
      if(/<head[^>]*>/i.test(html))html=html.replace(/<head([^>]*)>/i,"<head$1>"+baseTag);
      else html="<!DOCTYPE html><html><head>"+baseTag+"</head><body>"+html+"</body></html>";
      gameFrame.srcdoc=html;
      status.textContent="Running "+displayName(id)+" in the built-in player.";
    })
    .catch(error=>{
      closeGame();
      status.textContent="Could not load "+displayName(id)+": "+error.message;
    });
}
function render(){
 const query=search.value.trim().toLowerCase();
 const filtered=games.filter(id=>id.toLowerCase().includes(query)||displayName(id).toLowerCase().includes(query));
 stats.textContent="Showing "+filtered.length.toLocaleString()+" of "+games.length.toLocaleString()+" games";
 sections.replaceChildren();
 const grouped=new Map(chars.map(c=>[c,[]]));
 grouped.set("#",[]);
 for(const id of filtered)grouped.get(firstChar(id)).push(id);
 for(const c of [...chars,"#"]){
  const items=grouped.get(c);if(!items.length)continue;
  const section=document.createElement("section");section.className="section";section.id="letter-"+c;
  const heading=document.createElement("h2");heading.textContent=c;section.append(heading);
  const list=document.createElement("div");list.className="list";
  for(const id of items){const button=document.createElement("button");button.className="game";button.type="button";button.textContent=displayName(id);button.title=id;button.addEventListener("click",()=>launch(id));list.append(button)}
  section.append(list);sections.append(section);
 }
 for(const button of sidebar.querySelectorAll("button"))button.disabled=!grouped.get(button.dataset.letter).length;
}
function setupSidebar(){
 for(const c of [...chars,"#"]){const b=document.createElement("button");b.type="button";b.textContent=c;b.dataset.letter=c;b.addEventListener("click",()=>document.getElementById("letter-"+c)?.scrollIntoView({behavior:"smooth"}));sidebar.append(b)}
}
setupSidebar();
search.addEventListener("input",render);
fetch(DATA_URL).then(r=>{if(!r.ok)throw new Error("Unable to load ugs-games.json");return r.json()}).then(data=>{games=[...new Set(data)];render()}).catch(error=>{stats.textContent="Could not load the game catalog.";status.textContent=error.message});
</script></body></html>
